<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF3DB">
<title>Arrow Puzzle</title>
<style>
  /* Palette sampled from the shipped game's sprites and UI */
  :root {
    --bg: #FFF3DB;
    --ink: #000A41;
    --ink-soft: rgba(0, 10, 65, .55);
    --accent: #2E86ED;
    --btn-top: #59A5FB;
    --btn-bot: #1A6DD0;
    --heart: #EF4B53;
    --danger: #EF0000;
    --card: #FFFBF2;
    --dot: #E6D6B6;
    --gold: #F6B72A;
    --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; overscroll-behavior: none; touch-action: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  /* HUD */
  #top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 16px 0; min-height: 64px; }
  .round { width: 46px; height: 46px; border-radius: 50%; border: 0; background: #fff; box-shadow: 0 3px 0 rgba(0,10,65,.08), 0 6px 14px rgba(120,90,30,.16); display: grid; place-items: center; cursor: pointer; transition: transform .12s; padding: 0; }
  .round:active { transform: scale(.92) translateY(1px); }
  .round svg { width: 24px; height: 24px; }
  #title { text-align: center; line-height: 1.1; }
  #title b { font-size: 22px; font-weight: 800; letter-spacing: .2px; }
  #title small { display: block; margin-top: 3px; font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-soft); }
  #coins { justify-self: end; display: flex; align-items: center; gap: 7px; background: #fff; border-radius: 999px; padding: 6px 14px 6px 8px; font-weight: 800; font-size: 16px; box-shadow: 0 3px 0 rgba(0,10,65,.08), 0 6px 14px rgba(120,90,30,.16); }
  #coins i { width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE07A, var(--gold) 60%, #D98E0B); display: grid; place-items: center; box-shadow: inset 0 -2px 0 rgba(0,0,0,.12); }
  #coins i::after { content: ""; width: 10px; height: 10px; background: #FFF3C2; clip-path: polygon(50% 0, 62% 36%, 100% 38%, 70% 60%, 80% 100%, 50% 76%, 20% 100%, 30% 60%, 0 38%, 38% 36%); }
  #hearts { display: flex; justify-content: center; gap: 8px; padding: 12px 0 4px; height: 44px; }
  .heart { width: 30px; height: 28px; transition: transform .25s; }
  .heart path { fill: var(--heart); transition: fill .25s; }
  .heart.off path { fill: #fff; stroke: rgba(0,10,65,.12); stroke-width: 1; }
  .heart.pop { animation: pop .45s ease; }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.45); } 100% { transform: scale(1); } }

  #boardWrap { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hint { position: absolute; left: 0; right: 0; top: 6px; text-align: center; font-weight: 700; font-size: 15px; color: var(--ink-soft); pointer-events: none; opacity: 0; transition: opacity .3s; }
  #hint.show { opacity: 1; }
  #praise { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font-size: 34px; font-weight: 900; color: var(--accent); pointer-events: none; opacity: 0; text-shadow: 0 3px 0 rgba(255,255,255,.9); }
  #praise.go { animation: praise 1.1s ease-out forwards; }
  @keyframes praise { 0% { opacity: 0; transform: translateY(14px) scale(.7); } 18% { opacity: 1; transform: translateY(0) scale(1.08); } 70% { opacity: 1; transform: translateY(-14px) scale(1); } 100% { opacity: 0; transform: translateY(-38px) scale(1); } }

  /* Boosters */
  #boosters { display: flex; justify-content: center; gap: 22px; padding: 6px 0 20px; }
  .booster { position: relative; width: 74px; height: 74px; border-radius: 50%; border: 0; background: #fff; box-shadow: 0 4px 0 rgba(0,10,65,.08), 0 10px 20px rgba(120,90,30,.2); cursor: pointer; display: grid; place-items: center; transition: transform .12s; padding: 0; }
  .booster:active { transform: scale(.93) translateY(2px); }
  .booster svg { width: 38px; height: 38px; }
  .booster.on { box-shadow: 0 0 0 4px var(--accent), 0 10px 20px rgba(46,134,237,.35); }
  .booster .badge { position: absolute; right: -2px; top: -2px; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; background: linear-gradient(var(--btn-top), var(--btn-bot)); color: #fff; font-weight: 800; font-size: 14px; display: grid; place-items: center; border: 2px solid var(--bg); }
  .booster .badge.plus { background: linear-gradient(#FFD25C, #F0A912); }

  /* Overlays */
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(255, 243, 219, .86); padding: 24px; z-index: 10; }
  .overlay.show { display: flex; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; } }
  .card { width: min(380px, 100%); background: var(--card); border-radius: 32px; padding: 30px 26px 26px; text-align: center; box-shadow: 0 6px 0 rgba(0,10,65,.05), 0 24px 60px rgba(120,90,30,.28); animation: rise .35s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes rise { from { transform: translateY(26px) scale(.94); opacity: 0; } }
  .card h2 { margin: 0 0 8px; font-size: 28px; font-weight: 900; }
  .card p { margin: 0 0 22px; color: var(--ink-soft); font-size: 16px; line-height: 1.4; font-weight: 600; }
  .card .reward { display: inline-flex; align-items: center; gap: 8px; font-weight: 900; font-size: 26px; margin: 0 0 22px; }
  .card .reward i { width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE07A, var(--gold) 60%, #D98E0B); display: block; }

  .btn { display: block; width: 100%; border: 0; border-radius: 999px; padding: 17px 20px 19px; font: 800 19px var(--font); color: #fff; cursor: pointer; background: linear-gradient(var(--btn-top), #3F92F0); box-shadow: 0 6px 0 var(--btn-bot), 0 14px 22px rgba(26,109,208,.32); transition: transform .1s, box-shadow .1s; margin-top: 12px; }
  .btn:first-of-type { margin-top: 0; }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--btn-bot), 0 4px 10px rgba(26,109,208,.3); }
  .btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 6px 0 rgba(0,10,65,.1), 0 12px 20px rgba(120,90,30,.14); }
  .btn.ghost:active { box-shadow: 0 1px 0 rgba(0,10,65,.1); }
  .btn[disabled] { opacity: .45; pointer-events: none; }

  .row { display: flex; align-items: center; justify-content: space-between; padding: 14px 4px; font-weight: 700; font-size: 18px; text-align: left; border-bottom: 1px solid rgba(0,10,65,.07); }
  .row:last-of-type { border-bottom: 0; margin-bottom: 14px; }
  .switch { width: 54px; height: 32px; border-radius: 16px; background: #D9CDB6; position: relative; border: 0; cursor: pointer; transition: background .2s; flex: none; }
  .switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.25); transition: transform .2s; }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(22px); }

  #menu { background: var(--bg); flex-direction: column; gap: 0; }
  #menu .logo { font-size: 46px; font-weight: 900; line-height: 1; letter-spacing: -1px; margin-bottom: 6px; }
  #menu .sub { color: var(--ink-soft); font-weight: 700; margin-bottom: 36px; }
  #menu .stack { width: min(320px, 100%); }
  #menuArt { width: min(300px, 78vw); height: 190px; margin-bottom: 26px; position: relative; }
  #menuArt canvas { position: static; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div><button class="round" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="#000A41" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
    <div id="title"><b id="lvl">Level 1</b><small id="diff">Normal</small></div>
    <div id="coins"><i></i><span id="coinN">0</span></div>
  </div>
  <div id="hearts"></div>
  <div id="boardWrap">
    <canvas id="cv"></canvas>
    <div id="hint">Tap to remove</div>
    <div id="praise"></div>
  </div>
  <div id="boosters">
    <button class="booster" id="bHint" aria-label="Hint"><svg viewBox="0 0 24 24" fill="none" stroke="#000A41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" fill="#FFD25C"/></svg><span class="badge"></span></button>
    <button class="booster" id="bEraser" aria-label="Eraser"><svg viewBox="0 0 24 24" fill="none" stroke="#000A41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h12"/><path d="M5.6 15.6 13.8 7.4a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11.6 19.6H8.4z" fill="#59A5FB"/><path d="M10.5 10.7 16 16.2"/></svg><span class="badge"></span></button>
    <button class="booster" id="bWand" aria-label="Magic Wand"><svg viewBox="0 0 24 24" fill="none" stroke="#000A41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 15 9" stroke-width="3"/><path d="m15 9 2 2" stroke="#59A5FB" stroke-width="3"/><path d="M18 3v4M16 5h4M20 12v2M19 13h2M7 5v2M6 6h2" stroke="#F0A912"/></svg><span class="badge"></span></button>
  </div>
</div>

<div class="overlay show" id="menu">
  <div id="menuArt"><canvas id="menuCv"></canvas></div>
  <div class="logo">Arrow Puzzle</div>
  <div class="sub">Clear the field with smart moves</div>
  <div class="stack">
    <button class="btn" id="mPlay">Level 1</button>
    <button class="btn ghost" id="mSettings">Settings</button>
  </div>
</div>

<div class="overlay" id="modal"><div class="card" id="card"></div></div>

<script>
'use strict';
/* ============================================================
   Arrow Puzzle — rebuilt from scratch.
   Rules/copy/palette were taken from analysis of the shipped
   Easybrain build (Unity IL2CPP, v1.11.0); all art is drawn
   procedurally here, no original assets are included.
   ============================================================ */
const C = { bg:'#FFF3DB', ink:'#000A41', dot:'#E6D6B6', accent:'#2E86ED', danger:'#EF0000', hint:'#0087F3' };
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
const PRAISE = ['Smooth!','Sharp Move!','Unbelievable!','Boom!','Great Move!','Smart Move!','Good Call!','Awesome!','Nice Work!'];

/* ---------- persistence ---------- */
const store = {
  d: { level:1, coins:0, hint:2, eraser:2, wand:2, sound:true, vibe:true },
  load(){ try { Object.assign(this.d, JSON.parse(localStorage.getItem('arrowpuzzle.v1')||'{}')); } catch(e){} },
  save(){ try { localStorage.setItem('arrowpuzzle.v1', JSON.stringify(this.d)); } catch(e){} }
};
store.load();

/* ---------- audio / haptics ---------- */
let actx = null;
function tone(f, dur, type='sine', vol=.12, slide=0, delay=0){
  if(!store.d.sound) return;
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f+slide), t+dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02);
  } catch(e){}
}
const sfx = {
  slide(){ tone(520, .22, 'triangle', .1, 520); },
  bump(){ tone(150, .2, 'square', .09, -80); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,.4,'triangle',.12,0,i*.1)); },
  lose(){ [330,277,220].forEach((f,i)=>tone(f,.35,'sawtooth',.07,0,i*.14)); },
  pick(){ tone(880, .12, 'sine', .09); }
};
const vibrate = ms => { if(store.d.vibe && navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} };

/* ---------- level generation ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function levelCfg(n){
  const cols = Math.min(11, 4 + Math.floor((n-1)/2));
  const rows = Math.round(cols*1.5);
  return { cols, rows,
    maxLen: Math.min(20, 3 + Math.floor(n/1.4)),
    fill: Math.min(.92, .5 + n*.025),
    straight: Math.max(.25, .7 - n*.01) };
}
function difficulty(n){ return n%25===0 ? 'Master' : n%10===0 ? 'Expert' : n%5===0 ? 'Hard' : 'Normal'; }

/* Arrows are placed one at a time; a new arrow's exit ray may not touch any
   arrow placed before it. Removal order is therefore the reverse of placement,
   which makes every generated level solvable by construction. */
function generate(n){
  const cfg = levelCfg(n), rng = mulberry32((n*2654435761)>>>0 ^ 0x9e3779b9);
  const {cols, rows} = cfg, occ = new Int16Array(cols*rows).fill(-1), arrows = [];
  const idx = (c,r)=>r*cols+c, inb = (c,r)=>c>=0&&r>=0&&c<cols&&r<rows;
  const order = []; for(let i=0;i<cols*rows;i++) order.push(i);
  for(let i=order.length-1;i>0;i--){ const j=(rng()*(i+1))|0; [order[i],order[j]]=[order[j],order[i]]; }
  const target = Math.floor(cols*rows*cfg.fill); let filled = 0;

  const rayClear = (pts, own) => {
    const [hc,hr] = pts[pts.length-1], [pc,pr] = pts[pts.length-2];
    const dx = hc-pc, dy = hr-pr; let c=hc+dx, r=hr+dy;
    while(inb(c,r)){ if(occ[idx(c,r)]!==-1 || own.has(idx(c,r))) return false; c+=dx; r+=dy; }
    return true;
  };
  const passes = [cfg.maxLen, Math.ceil(cfg.maxLen/2), 3, 2];
  for(const maxLen of passes){
    for(const start of order){
      if(filled>=target) break;
      if(occ[start]!==-1) continue;
      for(let attempt=0; attempt<8; attempt++){
        const want = 2 + ((rng()*(maxLen-1))|0);
        const sc = start%cols, sr = (start/cols)|0;
        const pts = [[sc,sr]], own = new Set([start]); let lastDir = null;
        while(pts.length<want){
          const [c,r] = pts[pts.length-1], opts = [];
          for(const d of DIRS){ const nc=c+d[0], nr=r+d[1]; if(inb(nc,nr) && occ[idx(nc,nr)]===-1 && !own.has(idx(nc,nr))) opts.push(d); }
          if(!opts.length) break;
          let d = opts[(rng()*opts.length)|0];
          if(lastDir && rng()<cfg.straight){ const s = opts.find(o=>o[0]===lastDir[0]&&o[1]===lastDir[1]); if(s) d=s; }
          pts.push([c+d[0], r+d[1]]); own.add(idx(c+d[0], r+d[1])); lastDir = d;
        }
        if(pts.length<2) continue;
        let use = null;
        if(rayClear(pts, own)) use = pts;
        else { const rev = pts.slice().reverse(); if(rayClear(rev, own)) use = rev; }
        if(!use) continue;
        const id = arrows.length, h = use[use.length-1], p = use[use.length-2];
        arrows.push({ id, pts:use, dir:[h[0]-p[0], h[1]-p[1]] });
        for(const [c,r] of use) occ[idx(c,r)] = id;
        filled += use.length; break;
      }
    }
  }
  return { cfg, cols, rows, arrows };
}

/* ---------- game state ---------- */
const G = { level:null, arrows:[], occ:null, lives:3, total:0, combo:0, mode:null, hintId:-1, hintUntil:0, over:false, won:false, started:false };
const view = { z:1, ox:0, oy:0, cell:40, W:0, H:0, bx:0, by:0 };

function startLevel(n){
  const L = generate(n);
  G.level = L; G.lives = 3; G.combo = 0; G.mode = null; G.hintId = -1; G.over = false; G.won = false;
  G.occ = new Int16Array(L.cols*L.rows).fill(-1);
  G.arrows = L.arrows.map(a=>{
    const k = Math.max(L.cols, L.rows) + a.pts.length + 3, h = a.pts[a.pts.length-1];
    const ext = a.pts.concat([[h[0]+a.dir[0]*k, h[1]+a.dir[1]*k]]);
    const cum = [0]; for(let i=1;i<ext.length;i++) cum.push(cum[i-1] + Math.abs(ext[i][0]-ext[i-1][0]) + Math.abs(ext[i][1]-ext[i-1][1]));
    return { id:a.id, pts:a.pts, dir:a.dir, ext, cum, len:a.pts.length-1, state:'idle', s:0, v:0, t:0, flash:0, alpha:1, exitDist:0, bumpD:0 };
  });
  for(const a of G.arrows) for(const [c,r] of a.pts) G.occ[r*L.cols+c] = a.id;
  G.total = G.arrows.length;
  layout(); resetView(); updateHud();
  const h = $('hint'); h.classList.toggle('show', n<=2);
}

function distToExit(a){ // blocker distance (cells beyond head) or Infinity; plus edge distance
  const L = G.level, [hc,hr] = a.pts[a.pts.length-1]; let k=1;
  for(;;){ const c=hc+a.dir[0]*k, r=hr+a.dir[1]*k;
    if(c<0||r<0||c>=L.cols||r>=L.rows) return { blocked:false, edge:k };
    const o = G.occ[r*L.cols+c]; if(o!==-1 && o!==a.id) return { blocked:true, at:k };
    k++; }
}
const isFree = a => !distToExit(a).blocked;
const aliveArrows = () => G.arrows.filter(a=>a.state==='idle');

function pressArrow(a, free=false){
  if(G.over||G.won||a.state!=='idle') return;
  const ex = distToExit(a);
  if(free || !ex.blocked){ release(a, ex.blocked ? 1 : ex.edge); success(); }
  else bumpArrow(a, ex.at);
}
function release(a, edge){
  for(const [c,r] of a.pts) if(G.occ[r*G.level.cols+c]===a.id) G.occ[r*G.level.cols+c] = -1;
  a.state='exiting'; a.v=7; a.s=0; a.exitDist = edge + a.len + 1.5;
  if(G.hintId===a.id) G.hintId=-1;
  sfx.slide(); vibrate(8);
}
function success(){
  G.combo++; $('hint').classList.remove('show');
  if(G.combo%4===0) praise(PRAISE[(Math.random()*PRAISE.length)|0]);
  updateHud(); checkWin();
}
function bumpArrow(a, at){
  a.state='bump'; a.t=0; a.bumpD = Math.max(.22, at-1+.2); a.flash=1;
  G.combo = 0; G.lives--; sfx.bump(); vibrate(40);
  const hs = $('hearts').children; if(hs[G.lives]){ hs[G.lives].classList.add('pop'); setTimeout(()=>hs[G.lives]&&hs[G.lives].classList.remove('pop'),450); }
  updateHud();
  if(G.lives<=0){ G.over=true; setTimeout(showGameOver, 650); }
}
function checkWin(){
  if(aliveArrows().length===0 && !G.won){
    G.won = true; setTimeout(showWin, 750);
  }
}

/* ---------- layout & view ---------- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
function $(id){ return document.getElementById(id); }
function layout(){
  const wrap = $('boardWrap'), dpr = Math.min(window.devicePixelRatio||1, 3);
  view.W = wrap.clientWidth; view.H = wrap.clientHeight;
  cv.width = view.W*dpr; cv.height = view.H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!G.level) return;
  const L = G.level;
  view.cell = Math.min(view.W*.94/L.cols, view.H*.98/L.rows, 72);
  view.bx = (view.W - L.cols*view.cell)/2; view.by = (view.H - L.rows*view.cell)/2;
}
function resetView(){ view.z=1; view.ox=view.bx; view.oy=view.by; }
function clampView(){
  const L=G.level, bw=L.cols*view.cell*view.z, bh=L.rows*view.cell*view.z, m=24;
  view.ox = bw<=view.W ? (view.W-bw)/2 : Math.min(m, Math.max(view.W-bw-m, view.ox));
  view.oy = bh<=view.H ? (view.H-bh)/2 : Math.min(m, Math.max(view.H-bh-m, view.oy));
}
function zoomAt(px, py, nz){
  nz = Math.min(3.2, Math.max(1, nz)); const k = nz/view.z;
  view.ox = px-(px-view.ox)*k; view.oy = py-(py-view.oy)*k; view.z = nz; clampView();
}
const sx = x => view.ox + (x+.5)*view.cell*view.z, sy = y => view.oy + (y+.5)*view.cell*view.z;

/* ---------- arrow geometry ---------- */
function pointAt(a, s){
  const e=a.ext, cum=a.cum; if(s<=0) return [e[0][0], e[0][1]];
  for(let i=1;i<e.length;i++) if(s<=cum[i]){ const t=(s-cum[i-1])/(cum[i]-cum[i-1]); return [e[i-1][0]+(e[i][0]-e[i-1][0])*t, e[i-1][1]+(e[i][1]-e[i-1][1])*t]; }
  const l=e.length-1; return [e[l][0], e[l][1]];
}
function windowPts(a, s){
  const out=[pointAt(a,s)], end=s+a.len;
  for(let i=0;i<a.ext.length;i++) if(a.cum[i]>s+1e-6 && a.cum[i]<end-1e-6) out.push(a.ext[i]);
  out.push(pointAt(a,end)); return out;
}

/* ---------- drawing ---------- */
function drawArrow(g, a, W, color, glow){
  const cell = view.cell*view.z, off = a.state==='bump' ? bumpOffset(a) : a.s;
  const P0 = windowPts(a, off).map(p=>[sx(p[0]), sy(p[1])]); const P=[P0[0]];
  for(let i=1;i<P0.length;i++){ const q=P[P.length-1]; if(Math.hypot(P0[i][0]-q[0],P0[i][1]-q[1])>.5) P.push(P0[i]); }
  if(P.length<2) return;
  const lw = cell*.2, r = cell*.34;
  g.save(); g.globalAlpha = a.alpha; g.lineCap='round'; g.lineJoin='round';
  if(glow){ g.shadowColor=color; g.shadowBlur = cell*(.35+.25*Math.sin(performance.now()/160)); }
  g.strokeStyle=color; g.fillStyle=color; g.lineWidth=lw;
  g.beginPath(); g.moveTo(P[0][0],P[0][1]);
  for(let i=1;i<P.length-1;i++){
    const A=P[i-1], B=P[i], Cc=P[i+1], d1=Math.hypot(A[0]-B[0],A[1]-B[1]), d2=Math.hypot(Cc[0]-B[0],Cc[1]-B[1]), rr=Math.min(r,d1/2,d2/2);
    g.lineTo(B[0]+(A[0]-B[0])/d1*rr, B[1]+(A[1]-B[1])/d1*rr);
    g.quadraticCurveTo(B[0],B[1], B[0]+(Cc[0]-B[0])/d2*rr, B[1]+(Cc[1]-B[1])/d2*rr);
  }
  const E=P[P.length-1], Q=P[P.length-2], dl=Math.hypot(E[0]-Q[0],E[1]-Q[1])||1, ux=(E[0]-Q[0])/dl, uy=(E[1]-Q[1])/dl;
  g.lineTo(E[0],E[1]); g.stroke();
  // arrow head: triangle with softly rounded tips
  const hw=cell*.3, tip=cell*.38, bk=cell*.1;
  g.beginPath();
  g.moveTo(E[0]+ux*tip, E[1]+uy*tip);
  g.lineTo(E[0]-ux*bk-uy*hw, E[1]-uy*bk+ux*hw);
  g.lineTo(E[0]-ux*bk+uy*hw, E[1]-uy*bk-ux*hw);
  g.closePath(); g.lineWidth=lw*.45; g.fill(); g.stroke();
  g.restore();
}
function bumpOffset(a){
  const t=a.t, f=.12, b=.2;
  if(t<f){ const k=t/f; return a.bumpD*(1-(1-k)*(1-k)); }
  if(t<f+b){ const k=(t-f)/b; return a.bumpD*(1-(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2)); }
  return 0;
}
function mixRed(f){ // ink -> danger
  const a=[0,10,65], b=[239,0,0], c=a.map((v,i)=>Math.round(v+(b[i]-v)*f)); return `rgb(${c})`;
}
function drawBoard(g, W, H, ar){
  g.clearRect(0,0,W,H);
  const L=G.level; if(!L) return;
  // dot lattice
  g.fillStyle=C.dot; const dr=Math.max(2, view.cell*view.z*.07);
  for(let r=0;r<L.rows;r++) for(let c=0;c<L.cols;c++){ g.beginPath(); g.arc(sx(c),sy(r),dr,0,6.2832); g.fill(); }
  const now = performance.now();
  for(const a of ar){
    if(a.state==='gone') continue;
    let color=C.ink, glow=false;
    if(a.flash>0) color=mixRed(a.flash);
    else if(G.hintId===a.id && now<G.hintUntil){ color=C.hint; glow=true; }
    drawArrow(g,a,0,color,glow);
  }
}

let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  for(const a of G.arrows){
    if(a.state==='exiting'){ a.v = Math.min(46, a.v + 90*dt); a.s += a.v*dt; if(a.s>=a.exitDist){ a.state='gone'; } }
    else if(a.state==='bump'){ a.t += dt; a.flash = Math.max(0, a.flash - dt*1.6); if(a.t>.34){ a.state='idle'; a.s=0; } }
  }
  if(G.hintId!==-1 && now>G.hintUntil) G.hintId=-1;
  drawBoard(ctx, view.W, view.H, G.arrows);
  requestAnimationFrame(frame);
}

/* ---------- input: tap, pan, pinch, wheel ---------- */
const ptrs = new Map(); let pinch = null, moved = false, downAt = null;
function localXY(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, localXY(e));
  if(ptrs.size===1){ moved=false; downAt = localXY(e); }
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]), z:view.z}; moved=true; }
});
cv.addEventListener('pointermove', e=>{
  if(!ptrs.has(e.pointerId)) return;
  const p = localXY(e), prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, p);
  if(ptrs.size===2 && pinch){
    const [a,b]=[...ptrs.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    zoomAt((a[0]+b[0])/2, (a[1]+b[1])/2, pinch.z*d/pinch.d);
  } else if(ptrs.size===1){
    if(!moved && Math.hypot(p[0]-downAt[0], p[1]-downAt[1])>9) moved=true;
    if(moved && view.z>1){ view.ox += p[0]-prev[0]; view.oy += p[1]-prev[1]; clampView(); }
  }
});
function endPtr(e){
  const had = ptrs.has(e.pointerId), p = localXY(e); ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinch=null;
  if(had && !moved && ptrs.size===0 && e.type==='pointerup') tap(p[0], p[1]);
}
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e=>{ e.preventDefault(); const p=localXY(e); zoomAt(p[0],p[1], view.z*(e.deltaY<0?1.12:1/1.12)); }, {passive:false});

function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy; let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}
function arrowAt(x,y){
  const cell=view.cell*view.z; let best=null, bd=Math.max(cell*.46, 16);
  for(const a of G.arrows){
    if(a.state!=='idle') continue;
    for(let i=1;i<a.pts.length;i++){
      const d=segDist(x,y,sx(a.pts[i-1][0]),sy(a.pts[i-1][1]),sx(a.pts[i][0]),sy(a.pts[i][1]));
      if(d<bd){ bd=d; best=a; }
    }
  }
  return best;
}
function tap(x,y){
  if(G.over||G.won||!G.level) return;
  actxWake();
  const a = arrowAt(x,y); if(!a) return;
  if(G.mode==='eraser'){ G.mode=null; refreshBoosters(); store.d.eraser--; store.save(); release(a, distToExit(a).blocked?1:distToExit(a).edge); success(); refreshBoosters(); return; }
  pressArrow(a);
}
function actxWake(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} }

/* ---------- HUD ---------- */
const HEART = '<svg class="heart" viewBox="0 0 24 22"><path d="M12 21S1.5 14.6 1.5 7.6A5.6 5.6 0 0 1 12 4.6a5.6 5.6 0 0 1 10.5 3C22.5 14.6 12 21 12 21z"/></svg>';
function updateHud(){
  $('lvl').textContent = 'Level '+store.d.level;
  $('diff').textContent = difficulty(store.d.level);
  $('coinN').textContent = store.d.coins;
  const hs=$('hearts'); if(hs.children.length!==3) hs.innerHTML = HEART.repeat(3);
  [...hs.children].forEach((h,i)=>h.classList.toggle('off', i>=G.lives));
  refreshBoosters();
}
const BOOST = { hint:{el:'bHint', cost:40}, eraser:{el:'bEraser', cost:60}, wand:{el:'bWand', cost:80} };
function refreshBoosters(){
  for(const k in BOOST){
    const b=$(BOOST[k].el), n=store.d[k], s=b.querySelector('.badge');
    s.textContent = n>0 ? n : '+'; s.classList.toggle('plus', n<=0);
    b.classList.toggle('on', G.mode===k);
  }
}
function useBooster(k){
  if(G.over||G.won) return; actxWake();
  if(store.d[k]<=0){
    const cost=BOOST[k].cost;
    if(store.d.coins>=cost){ store.d.coins-=cost; store.d[k]+=1; store.save(); sfx.pick(); updateHud(); }
    else toast('Not enough coins');
    return;
  }
  const free = aliveArrows().filter(isFree);
  if(k==='hint'){
    if(!free.length) return;
    G.hintId = free[(Math.random()*free.length)|0].id; G.hintUntil = performance.now()+2600;
    store.d.hint--; sfx.pick();
  } else if(k==='eraser'){
    G.mode = G.mode==='eraser' ? null : 'eraser'; sfx.pick();
    if(G.mode) toast('Tap an arrow to erase it'); store.d.eraser; refreshBoosters(); return;
  } else if(k==='wand'){
    if(!free.length) return;
    store.d.wand--; pressArrow(free[(Math.random()*free.length)|0]);
  }
  store.save(); updateHud();
}
['hint','eraser','wand'].forEach(k=>$(BOOST[k].el).addEventListener('click',()=>useBooster(k)));

function praise(t){ const p=$('praise'); p.textContent=t; p.classList.remove('go'); void p.offsetWidth; p.classList.add('go'); }
function toast(t){ const h=$('hint'); h.textContent=t; h.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>{ h.classList.remove('show'); setTimeout(()=>h.textContent='Tap to remove',300); },1800); }

/* ---------- modals ---------- */
function modal(html){ $('card').innerHTML=html; $('modal').classList.add('show'); }
function closeModal(){ $('modal').classList.remove('show'); }
function pct(){ return G.total? Math.round((1-aliveArrows().length/G.total)*100):0; }
function showWin(){
  sfx.win(); vibrate([30,40,60]);
  const reward = 10 + Math.min(40, store.d.level) + (G.lives===3?10:0);
  store.d.coins += reward; store.d.level++; store.save(); updateHud();
  modal(`<h2>Level Completed!</h2><p>${G.lives===3?'Flawless — no mistakes!':'Nicely done.'}</p><div class="reward"><i></i>+${reward}</div>
    <button class="btn" id="mNext">Next Game</button><button class="btn ghost" id="mMain">Main</button>`);
  $('mNext').onclick=()=>{ closeModal(); startLevel(store.d.level); };
  $('mMain').onclick=()=>{ closeModal(); showMenu(); };
}
function showGameOver(){
  sfx.lose();
  modal(`<h2>Game Over</h2><p>You've made 3 mistakes and lost this game.<br><b>${pct()}% Completed</b></p>
    <button class="btn" id="mCont">Continue Playing · 100 coins</button><button class="btn ghost" id="mRestart">Restart</button>`);
  const c=$('mCont'); if(store.d.coins<100) c.setAttribute('disabled','');
  c.onclick=()=>{ store.d.coins-=100; store.save(); G.lives=1; G.over=false; closeModal(); updateHud(); };
  $('mRestart').onclick=()=>{ closeModal(); startLevel(store.d.level); };
}
function showSettings(){
  const row=(id,label,on)=>`<div class="row"><span>${label}</span><button class="switch ${on?'on':''}" id="${id}" aria-label="${label}"></button></div>`;
  modal(`<h2>Settings</h2>${row('sSound','Sounds',store.d.sound)}${row('sVibe','Vibration',store.d.vibe)}
    <button class="btn" id="sClose">Continue</button><button class="btn ghost" id="sRestart">Restart Level</button>`);
  const flip=(id,key)=>$(id).onclick=()=>{ store.d[key]=!store.d[key]; $(id).classList.toggle('on',store.d[key]); store.save(); if(key==='sound') sfx.pick(); else vibrate(30); };
  flip('sSound','sound'); flip('sVibe','vibe');
  $('sClose').onclick=closeModal; $('sRestart').onclick=()=>{ closeModal(); startLevel(store.d.level); };
}
$('btnSettings').onclick=showSettings;

/* ---------- main menu with a live decorative board ---------- */
function showMenu(){ $('mPlay').textContent='Level '+store.d.level; $('menu').classList.add('show'); drawMenuArt(); }
function drawMenuArt(){
  const mc=$('menuCv'), g=mc.getContext('2d'), w=mc.parentElement.clientWidth, h=mc.parentElement.clientHeight, dpr=Math.min(devicePixelRatio||1,3);
  mc.width=w*dpr; mc.height=h*dpr; mc.style.width=w+'px'; mc.style.height=h+'px'; g.setTransform(dpr,0,0,dpr,0,0);
  const art=generate(7); const cell=Math.min(w/art.cols,h/art.rows)*.98;
  const saved={z:view.z,ox:view.ox,oy:view.oy,cell:view.cell}, savedLevel=G.level, savedArrows=G.arrows;
  const mk=art.arrows.map(a=>({pts:a.pts,dir:a.dir,len:a.pts.length-1,s:0,alpha:1,state:'idle',ext:a.pts,cum:a.pts.map((_,i)=>i)}));
  view.z=1; view.cell=cell; view.ox=(w-art.cols*cell)/2; view.oy=(h-art.rows*cell)/2;
  G.level=art;
  g.clearRect(0,0,w,h); g.fillStyle=C.dot;
  for(let r=0;r<art.rows;r++) for(let c=0;c<art.cols;c++){ g.beginPath(); g.arc(sx(c),sy(r),cell*.07,0,6.2832); g.fill(); }
  for(const a of mk) drawArrow(g,a,0,C.ink,false);
  G.level=savedLevel; Object.assign(view,saved);
}
$('mPlay').onclick=()=>{ actxWake(); $('menu').classList.remove('show'); startLevel(store.d.level); };
$('mSettings').onclick=showSettings;

/* ---------- boot ---------- */
window.addEventListener('resize', ()=>{ layout(); if(G.level){ resetView(); } if($('menu').classList.contains('show')) drawMenuArt(); });
$('mPlay').textContent='Level '+store.d.level;
layout(); startLevel(store.d.level); drawMenuArt(); updateHud();
requestAnimationFrame(frame);
window.__arrow = { generate, G, store, startLevel, isFree, aliveArrows, pressArrow, distToExit };
</script>
</body>
</html>
